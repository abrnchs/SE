<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="930" viewBox="0 0 1350 930" role="img" aria-labelledby="title desc">
  <title id="title">Mapa completo das ligações do LCD e dos botões à LPCXpresso LPC1769</title>
  <desc id="desc">Com o USB em baixo, J2-54 a J2-28 ficam na fila esquerda e J2-27 a J2-1 na fila direita. O LCD liga P0.0 a P0.5 e os botões ligam P2.0 a P2.2.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212e; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #526174; }
    .panel { fill: #f4f8fd; stroke: #b9cbe1; stroke-width: 2; }
    .panel-title { font-size: 24px; font-weight: 700; }
    .section { font-size: 18px; font-weight: 700; }
    .row { font-size: 17px; }
    .small { font-size: 15px; fill: #526174; }
    .board-label { font-size: 14px; font-weight: 700; fill: white; }
    .rail { fill: #c8d7e7; }
    .lcd { fill: #2470b8; }
    .button { fill: #d2731d; }
    .ground { fill: #283b4c; }
  </style>

  <rect width="1350" height="920" fill="white"/>
  <text class="title" x="38" y="49">Mapa completo da montagem — Lab 06</text>
  <text class="subtitle" x="38" y="78">Vista de cima da LPCXpresso, com o USB em baixo como na tua fotografia. Os círculos assinalam contactos do J2.</text>

  <!-- LCD -->
  <rect class="panel" x="30" y="111" width="365" height="700" rx="17"/>
  <text class="panel-title" x="52" y="151">LCD 16×2</text>
  <text class="small" x="52" y="177">Pino do LCD → placa LPCXpresso</text>
  <line x1="52" y1="191" x2="370" y2="191" stroke="#c7d6e8"/>
  <text class="section" x="52" y="226">Sinais</text>
  <text class="row" x="52" y="262">11 · DB4 → P0.0 · J2-9</text>
  <text class="row" x="52" y="299">12 · DB5 → P0.1 · J2-10</text>
  <text class="row" x="52" y="336">13 · DB6 → P0.2 · J2-21</text>
  <text class="row" x="52" y="373">14 · DB7 → P0.3 · J2-22</text>
  <text class="row" x="52" y="410">4 · RS → P0.4 · J2-38</text>
  <text class="row" x="52" y="447">6 · E → P0.5 · J2-39</text>
  <line x1="52" y1="474" x2="370" y2="474" stroke="#c7d6e8"/>
  <text class="section" x="52" y="509">Alimentação e controlo</text>
  <text class="row" x="52" y="546">1 · VSS → GND comum</text>
  <text class="row" x="52" y="583">2 · VDD → +5 V regulados</text>
  <text class="row" x="52" y="620">3 · VEE → cursor do potenciómetro</text>
  <text class="row" x="52" y="657">5 · R/W → GND comum</text>
  <text class="small" x="52" y="704">Potenciómetro: extremos a +5 V e GND.</text>
  <text class="small" x="52" y="733">DB0–DB3 e LEDA/LEDK ficam livres.</text>
  <text class="small" x="52" y="762">J2-2 é entrada VIN, não saída de +5 V.</text>

  <!-- Placa e os 54 contactos, em escala de ordem -->
  <rect class="panel" x="415" y="111" width="515" height="700" rx="17"/>
  <text class="panel-title" x="438" y="151">LPCXpresso LPC1769</text>
  <text class="small" x="438" y="177">J2: esquerda 54→28; direita 27→1</text>
  <rect x="484" y="205" width="375" height="560" rx="20" fill="#1c426c"/>
  <rect x="632" y="380" width="80" height="92" rx="7" fill="#172535" stroke="#7f9ab3" stroke-width="2"/>
  <rect x="645" y="730" width="55" height="35" rx="5" fill="#c8d6e3"/>
  <text x="672" y="753" text-anchor="middle" font-size="16" font-weight="700">USB</text>

  <!-- 27 pads de cada lado. A ordem foi obtida do esquema J2 da placa. -->
  <g class="rail">
    <circle cx="484" cy="218" r="5"/><circle cx="484" cy="238" r="5"/><circle cx="484" cy="258" r="5"/><circle cx="484" cy="278" r="5"/><circle cx="484" cy="298" r="5"/><circle cx="484" cy="318" r="5"/><circle cx="484" cy="338" r="5"/><circle cx="484" cy="358" r="5"/><circle cx="484" cy="378" r="5"/><circle cx="484" cy="398" r="5"/><circle cx="484" cy="418" r="5"/><circle cx="484" cy="438" r="5"/><circle cx="484" cy="458" r="5"/><circle cx="484" cy="478" r="5"/><circle cx="484" cy="498" r="5"/><circle cx="484" cy="518" r="5"/><circle cx="484" cy="538" r="5"/><circle cx="484" cy="558" r="5"/><circle cx="484" cy="578" r="5"/><circle cx="484" cy="598" r="5"/><circle cx="484" cy="618" r="5"/><circle cx="484" cy="638" r="5"/><circle cx="484" cy="658" r="5"/><circle cx="484" cy="678" r="5"/><circle cx="484" cy="698" r="5"/><circle cx="484" cy="718" r="5"/><circle cx="484" cy="738" r="5"/>
    <circle cx="859" cy="218" r="5"/><circle cx="859" cy="238" r="5"/><circle cx="859" cy="258" r="5"/><circle cx="859" cy="278" r="5"/><circle cx="859" cy="298" r="5"/><circle cx="859" cy="318" r="5"/><circle cx="859" cy="338" r="5"/><circle cx="859" cy="358" r="5"/><circle cx="859" cy="378" r="5"/><circle cx="859" cy="398" r="5"/><circle cx="859" cy="418" r="5"/><circle cx="859" cy="438" r="5"/><circle cx="859" cy="458" r="5"/><circle cx="859" cy="478" r="5"/><circle cx="859" cy="498" r="5"/><circle cx="859" cy="518" r="5"/><circle cx="859" cy="538" r="5"/><circle cx="859" cy="558" r="5"/><circle cx="859" cy="578" r="5"/><circle cx="859" cy="598" r="5"/><circle cx="859" cy="618" r="5"/><circle cx="859" cy="638" r="5"/><circle cx="859" cy="658" r="5"/><circle cx="859" cy="678" r="5"/><circle cx="859" cy="698" r="5"/><circle cx="859" cy="718" r="5"/><circle cx="859" cy="738" r="5"/>
  </g>

  <!-- Sinais importantes na fila esquerda, USB em baixo -->
  <circle class="ground" cx="484" cy="218" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="502" y="223">J2-54 · GND</text>
  <circle class="button" cx="484" cy="418" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="502" y="423">J2-44 · P2.2 · C</text>
  <circle class="button" cx="484" cy="438" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="502" y="443">J2-43 · P2.1 · B</text>
  <circle class="button" cx="484" cy="458" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="502" y="463">J2-42 · P2.0 · A</text>
  <circle class="lcd" cx="484" cy="518" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="502" y="523">J2-39 · P0.5 · E</text>
  <circle class="lcd" cx="484" cy="538" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="502" y="543">J2-38 · P0.4 · RS</text>

  <!-- Sinais importantes na fila direita, USB em baixo -->
  <circle class="lcd" cx="859" cy="318" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="841" y="323" text-anchor="end">DB7 · P0.3 · J2-22</text>
  <circle class="lcd" cx="859" cy="338" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="841" y="343" text-anchor="end">DB6 · P0.2 · J2-21</text>
  <circle class="lcd" cx="859" cy="558" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="841" y="563" text-anchor="end">DB5 · P0.1 · J2-10</text>
  <circle class="lcd" cx="859" cy="578" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="841" y="583" text-anchor="end">DB4 · P0.0 · J2-9</text>
  <circle class="ground" cx="859" cy="738" r="10" stroke="white" stroke-width="2"/>
  <text class="board-label" style="fill:#ffffff" x="841" y="723" text-anchor="end">GND · J2-1</text>

  <!-- Módulo de botões -->
  <rect class="panel" x="950" y="111" width="370" height="700" rx="17"/>
  <text class="panel-title" x="972" y="151">Módulo 3-Button</text>
  <text class="small" x="972" y="177">Foto atual: CN1 direita; CN2 esquerda</text>
  <line x1="972" y1="191" x2="1295" y2="191" stroke="#c7d6e8"/>
  <text class="section" x="972" y="226">Botão A</text>
  <text class="row" x="972" y="263">CN1-1 → P2.0 · J2-42</text>
  <text class="row" x="972" y="293">CN2-1 → GND comum</text>
  <line x1="972" y1="321" x2="1295" y2="321" stroke="#c7d6e8"/>
  <text class="section" x="972" y="357">Botão B</text>
  <text class="row" x="972" y="394">CN1-3 → P2.1 · J2-43</text>
  <text class="row" x="972" y="424">CN2-3 → GND comum</text>
  <line x1="972" y1="452" x2="1295" y2="452" stroke="#c7d6e8"/>
  <text class="section" x="972" y="488">Botão C</text>
  <text class="row" x="972" y="525">CN1-5 → P2.2 · J2-44</text>
  <text class="row" x="972" y="555">CN2-5 → GND comum</text>
  <line x1="972" y1="583" x2="1295" y2="583" stroke="#c7d6e8"/>
  <text class="small" x="972" y="626">CN2-1, 3 e 5 podem partilhar</text>
  <text class="small" x="972" y="649">o GND do LCD.</text>
  <text class="small" x="972" y="681">O módulo não usa +5 V.</text>
  <text class="small" x="972" y="704">Os pinos 2, 4 e 6 ficam livres.</text>
  <text class="small" x="972" y="737">Pino 1 em cima; pinos por baixo.</text>
  <text class="small" x="972" y="760">Jumpers na mesma linha dos pinos.</text>

  <rect x="30" y="831" width="1290" height="81" rx="13" fill="#eaf0f6" stroke="#becddd"/>
  <text class="section" x="51" y="863">Uma única terra para todos os componentes</text>
  <text class="row" x="51" y="892">GND J2-54/J2-1 ↔ LCD pinos 1 e 5 ↔ potenciómetro ↔ CN2-1, 3 e 5 ↔ negativo da fonte de +5 V</text>
</svg>
