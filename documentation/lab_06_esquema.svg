<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
  <title id="title">Ligações do módulo de três botões à LPCXpresso LPC1769</title>
  <desc id="desc">Vista de cima do módulo, com CN1 em cima e CN2 em baixo; A, B e C ligam respetivamente a P2.0, P2.1 e P2.2. CN2-1, CN2-3 e CN2-5 ligam ao GND comum.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212e; }
    .title { font-size: 29px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #4b596a; }
    .panel-title { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #526174; }
    .pin { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .button { font-size: 23px; font-weight: 700; text-anchor: middle; }
    .row { font-size: 18px; font-weight: 600; }
  </style>

  <rect width="1080" height="700" fill="#ffffff"/>
  <text class="title" x="45" y="47">Lab 06 — esquema das ligações</text>
  <text class="subtitle" x="45" y="74">Vistas de cima. Na LPCXpresso, o USB fica em baixo, como na tua montagem.</text>

  <!-- Vista física do módulo -->
  <rect x="40" y="106" width="465" height="355" rx="17" fill="#f3f8ff" stroke="#b5c9e4" stroke-width="2"/>
  <text class="panel-title" x="63" y="139">Módulo 3-Button</text>
  <text class="small" x="63" y="162">Botões A, B e C virados para ti</text>
  <text class="label" x="66" y="213">CN1</text>
  <text class="label" x="66" y="418">CN2</text>

  <rect x="149" y="188" width="34" height="34" rx="3" fill="#2470b8"/>
  <circle cx="210" cy="205" r="17" fill="#dce5ef"/>
  <circle cx="270" cy="205" r="17" fill="#8c53ba"/>
  <circle cx="330" cy="205" r="17" fill="#dce5ef"/>
  <circle cx="390" cy="205" r="17" fill="#c67321"/>
  <circle cx="450" cy="205" r="17" fill="#dce5ef"/>
  <text class="pin" x="166" y="210" fill="white">1</text>
  <text class="pin" x="210" y="210">2</text>
  <text class="pin" x="270" y="210" fill="white">3</text>
  <text class="pin" x="330" y="210">4</text>
  <text class="pin" x="390" y="210" fill="white">5</text>
  <text class="pin" x="450" y="210">6</text>

  <rect x="139" y="277" width="60" height="58" rx="8" fill="#d8eafa" stroke="#2470b8" stroke-width="2"/>
  <rect x="240" y="277" width="60" height="58" rx="8" fill="#edddfa" stroke="#8c53ba" stroke-width="2"/>
  <rect x="360" y="277" width="60" height="58" rx="8" fill="#fae9d6" stroke="#c67321" stroke-width="2"/>
  <text class="button" x="169" y="314">A</text>
  <text class="button" x="270" y="314">B</text>
  <text class="button" x="390" y="314">C</text>

  <rect x="149" y="388" width="34" height="34" rx="3" fill="#2c3e50"/>
  <circle cx="210" cy="405" r="17" fill="#dce5ef"/>
  <circle cx="270" cy="405" r="17" fill="#2c3e50"/>
  <circle cx="330" cy="405" r="17" fill="#dce5ef"/>
  <circle cx="390" cy="405" r="17" fill="#2c3e50"/>
  <circle cx="450" cy="405" r="17" fill="#dce5ef"/>
  <text class="pin" x="166" y="410" fill="white">1</text>
  <text class="pin" x="210" y="410">2</text>
  <text class="pin" x="270" y="410" fill="white">3</text>
  <text class="pin" x="330" y="410">4</text>
  <text class="pin" x="390" y="410" fill="white">5</text>
  <text class="pin" x="450" y="410">6</text>
  <text class="small" x="149" y="446">O contacto quadrado à esquerda marca o pino 1.</text>
  <text class="small" x="63" y="482">Na foto atual, CN1 fica à direita e CN2 à esquerda; o pino 1 fica em cima.</text>

  <!-- Vista aproximada da LPCXpresso -->
  <rect x="555" y="106" width="485" height="355" rx="17" fill="#f3f8ff" stroke="#b5c9e4" stroke-width="2"/>
  <text class="panel-title" x="580" y="139">LPCXpresso LPC1769</text>
  <text class="small" x="580" y="162">Borda esquerda da placa azul, perto do chip preto</text>
  <rect x="680" y="180" width="250" height="201" rx="12" fill="#1c426c"/>
  <rect x="872" y="247" width="48" height="76" rx="5" fill="#18212a" stroke="#7c94aa"/>
  <rect x="770" y="351" width="70" height="30" rx="5" fill="#a8b9c8"/>
  <text x="805" y="371" text-anchor="middle" font-size="14" font-weight="700">USB</text>

  <circle cx="679" cy="207" r="10" fill="#c67321" stroke="white" stroke-width="2"/>
  <circle cx="679" cy="253" r="10" fill="#8c53ba" stroke="white" stroke-width="2"/>
  <circle cx="679" cy="299" r="10" fill="#2470b8" stroke="white" stroke-width="2"/>
  <text class="label" x="708" y="213" fill="#ffffff">P2.2 · J2-44</text>
  <text class="label" x="708" y="259" fill="#ffffff">P2.1 · J2-43</text>
  <text class="label" x="708" y="305" fill="#ffffff">P2.0 · J2-42</text>
  <text class="small" x="580" y="411">GND: usa a mesma linha de terra do LCD.</text>
  <text class="small" x="580" y="442">P2.x: posição aproximada; confirma pelos rótulos da placa.</text>

  <!-- Ligações elétricas -->
  <text class="panel-title" x="45" y="515">Liga os fios assim</text>
  <line x1="45" y1="530" x2="1035" y2="530" stroke="#cfdae7"/>
  <circle cx="64" cy="559" r="8" fill="#2470b8"/>
  <text class="row" x="87" y="566">A: CN1-1 → P2.0 (J2-42)</text>
  <circle cx="550" cy="559" r="8" fill="#8c53ba"/>
  <text class="row" x="573" y="566">B: CN1-3 → P2.1 (J2-43)</text>
  <circle cx="64" cy="608" r="8" fill="#c67321"/>
  <text class="row" x="87" y="615">C: CN1-5 → P2.2 (J2-44)</text>
  <circle cx="550" cy="608" r="8" fill="#2c3e50"/>
  <text class="row" x="573" y="615">CN2-1, 3 e 5 → GND</text>
  <text class="small" x="45" y="659">Os pinos 2, 4 e 6 repetem o mesmo lado dos botões e podem ficar livres. Não ligar +5 V ao módulo.</text>
  <text class="small" x="45" y="683">Com pinos soldados por baixo, coloca cada jumper na mesma linha da breadboard que o respetivo pino.</text>
</svg>
